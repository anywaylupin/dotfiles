# Vietnamese input, Telex.
#
# Telex composes tones from letter pairs: aa -> â, ee -> ê, oo -> ô, dd -> đ,
# and s/f/r/x/j add the tones. "Modern style" is the newer tone placement
# (hoà rather than hòa).

# Input method
InputMethod=Telex
# Output charset
OutputCharset=Unicode
# Spell check
SpellCheck=True
# Use oà, uý (instead of òa, úy)
Macro=True
# Enable spell check but allow typing words not in the dictionary
AutoNonVnRestore=True
# Allow type with more freedom
ModernStyle=False
# Process W at word beginning
ProcessWAtBegin=True
